name: ci
# The single CI workflow: unit/lint/envtest (check), image build (image), and
# the kind e2e suite (e2e), sharing one trigger list so they can't drift.
#
# push is limited to main so a PR branch runs once (via pull_request), not
# twice. Both triggers are path-filtered to anything that can change the
# build, tests, lint, image, or manifests; docs-only changes (*.md other
# than CHANGELOG.md, docs/, examples/) skip CI entirely.
on:
  push:
    branches: [main]
    paths: &ci-paths
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".ko.yaml"
      - "deploy/**"
      - "hack/**"
      - "Makefile"
      - ".golangci.yml"
      # changelog-test validates the real CHANGELOG.md, so it isn't a
      # docs-only file as far as CI is concerned.
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *ci-paths
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go.mod's toolchain directive is the single source of the Go version.
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go at least as new as go.mod's go directive.
          version: v2.13.2
          args: --timeout=5m
      - name: enable FUSE allow_other
        # The pkg/objectfs FUSE tests mount with AllowOther, matching
        # production (the driver runs as root in a privileged DaemonSet,
        # where this restriction doesn't apply). The runner user is
        # unprivileged, so fusermount3 refuses -o allow_other unless
        # user_allow_other is set in /etc/fuse.conf.
        run: echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
      # This intentionally is not `make check`: lint already ran above via
      # golangci-lint-action (its own caching), and build runs as its own
      # step below. Naming this step "make check" previously implied it ran
      # the full check target — it doesn't — and a reviewer trusting that
      # name once left lint red for three tasks.
      - name: make fmt-check vet tidy-check cover changelog-test
        run: make fmt-check vet tidy-check cover changelog-test
      - name: go build ./...
        run: go build ./...
      - name: api semantics (envtest)
        # setup-envtest is its own module (v0.24.0+); pinned rather than
        # @latest so a new release can't change CI without a commit. Its
        # go.mod needs go >= 1.26, which the go.mod toolchain satisfies.
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1
          make envtest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go.mod's toolchain directive is the single source of the Go version.
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: ko build linux/amd64 + linux/arm64
        env:
          VERSION: ci
        run: make ko
      - name: smoke test -h
        # The image is distroless: no shell and, by design, no fusermount3
        # (the driver uses go-fuse DirectMount). -h is the whole smoke test.
        env:
          VERSION: ci
        run: |
          ref=$(KO_DOCKER_REPO=ko.local ko build --bare --local --platform=linux/amd64 ./cmd/node)
          docker run --rm "$ref" -h

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go.mod's toolchain directive is the single source of the Go version.
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - run: make e2e
