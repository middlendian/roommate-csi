name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m
      - name: enable FUSE allow_other
        # The pkg/objectfs FUSE tests mount with AllowOther, matching
        # production (the driver runs as root in a privileged DaemonSet,
        # where this restriction doesn't apply). The runner user is
        # unprivileged, so fusermount3 refuses -o allow_other unless
        # user_allow_other is set in /etc/fuse.conf.
        run: echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
      - name: make check
        run: make fmt-check vet tidy-check cover
      - name: go build ./...
        run: go build ./...
      - name: api semantics (envtest)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          make envtest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: make docker
        run: make docker
      - name: smoke test -h
        run: docker run --rm ghcr.io/middlendian/roommate-csi:dev -h
      - name: smoke test fusermount3 is present
        # fuse3 supplies fusermount3, which go-fuse shells out to for
        # unmounting; confirm it's actually in the image.
        run: docker run --rm --entrypoint fusermount3 ghcr.io/middlendian/roommate-csi:dev -V
