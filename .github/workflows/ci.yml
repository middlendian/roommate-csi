name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m
      - name: make check
        run: make fmt-check vet tidy-check cover
      - name: go build ./...
        run: go build ./...
