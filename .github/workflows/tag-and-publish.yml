name: Tag and publish
# Expressions can't strip the "release/" prefix, so the title shows the head
# branch (release/vX.Y.Z). Runs for non-release PRs (skipped by the detect
# job) show their branch too.
run-name: Tag and publish ${{ github.event.pull_request.head.ref }}

# The only way to tag and publish a release: merging a release PR (head
# branch release/vX.Y.Z, opened by cut-release.yml) into main. There is
# deliberately no workflow_dispatch. The version comes from the head branch
# name, so squash and merge-commit modes both work. Creates the vX.Y.Z tag
# at the merge commit, then calls release.yml.
#
# To retry after a flake, use "Re-run failed jobs" on the run. That re-runs
# the same commit's workflow files, so a bug in the pipeline itself is fixed
# by merging the fix and cutting a new version, not by re-running.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # push tag

# Two release PRs merged close together must not publish concurrently.
# Never cancel an in-flight release to start another.
concurrency:
  group: tag-and-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release PR
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    outputs:
      version: ${{ steps.detect.outputs.version }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - id: detect
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'
          version="${PR_HEAD_REF#release/}"
          echo "::notice::Detected release PR: head=$PR_HEAD_REF version=$version"
          if [[ ! "$version" =~ $re ]]; then
            echo "::error::version $version does not look like vX.Y.Z[-prerelease]"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$PR_MERGE_SHA" >> "$GITHUB_OUTPUT"

  tag:
    name: Create ${{ needs.detect.outputs.version }} tag
    needs: detect
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      MERGE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Check for existing tag
        # An existing tag is accepted only if it already points at this
        # PR's merge commit (a re-run of this same run). A tag pushed by
        # hand, or left over from another commit, fails the run rather than
        # publishing whatever it points at.
        id: check
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/tags/$VERSION:refs/tags/$VERSION" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            tagged=$(git rev-parse "$VERSION^{commit}")
            if [ "$tagged" != "$MERGE_SHA" ]; then
              echo "::error::tag $VERSION already exists at $tagged, not at this PR's merge commit $MERGE_SHA"; exit 1
            fi
            echo "::notice::tag $VERSION already exists at the merge commit; skipping create"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify kustomization newTag matches release version
        run: |
          set -euo pipefail
          k=deploy/kustomize/base/kustomization.yaml
          tag=$(awk '/^[[:space:]]+newTag:/ {print $2; exit}' "$k")
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::$k newTag ($tag) does not match release version ($VERSION)"; exit 1
          fi
      - name: Create and push tag
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

  release:
    name: Build and publish ${{ needs.detect.outputs.version }}
    needs: [detect, tag]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write   # create GitHub release
      packages: write   # push images to ghcr.io
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.version }}
